[project]
name = "agentcp"
version = "0.1.0"
description = "A deterministic control plane for agent pipelines: routing, permissions, budget and human approval as ordinary code"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
